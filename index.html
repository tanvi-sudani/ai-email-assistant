<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Email Assistant</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>AI Email Assistant</h1>
      <button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <div class="form-group">
      <label>Email Topic</label>
      <input type="text" id="topic" placeholder="Example: Leave Request">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Tone</label>
        <select id="tone">
          <option>Professional</option>
          <option>Friendly</option>
          <option>Formal</option>
        </select>
      </div>

      <div class="form-group">
        <label>Template</label>
        <select id="template">
          <option>Formal Business</option>
          <option>Job Application</option>
          <option>Meeting Request</option>
          <option>Follow Up</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Prompting Technique</label>
        <select id="technique">
          <option>Role Prompting</option>
          <option>Zero Shot Prompting</option>
          <option>Few Shot Prompting</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email Length</label>
        <select id="length">
          <option>Short</option>
          <option>Medium</option>
          <option>Long</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Key Points</label>
      <textarea id="points" placeholder="Example: Requesting sick leave for 2 days due to fever"></textarea>
    </div>

    <button class="generate-btn" onclick="generateEmail()">Generate Email</button>

    <div class="result-box">
      <div class="result-header">
        <h3>Generated Email</h3>
        <div class="action-buttons">
          <button onclick="copyEmail()">Copy</button>
          <button onclick="downloadTXT()">Download</button>
        </div>
      </div>
      <div id="result">Your generated email will appear here...</div>
    </div>

    <div class="result-box">
      <div class="result-header">
        <h3>Generated Prompt</h3>
      </div>
      <div id="promptResult">Your AI prompt will appear here...</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
